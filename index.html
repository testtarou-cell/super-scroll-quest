<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SUPER SCROLL QUEST — 横スクロールアクション</title>
<style>
  html,body{margin:0;padding:0;background:#10101c;height:100%;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#10101c}
  canvas{display:block;background:#5c94fc;image-rendering:pixelated;max-width:100vw;max-height:100vh}
  #touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;
    padding:0 10px 14px;pointer-events:none;z-index:5}
  #touch .grp{display:flex;gap:10px;pointer-events:none}
  #touch button{pointer-events:auto;width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
    background:rgba(20,20,40,.38);color:#fff;font-size:22px;font-weight:700;touch-action:none}
  #touch button:active{background:rgba(255,255,255,.35)}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="grp">
    <button id="tLeft">◀</button><button id="tRight">▶</button>
  </div>
  <div class="grp">
    <button id="tRun">B</button><button id="tJump">A</button>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   SUPER SCROLL QUEST — オリジナル横スクロールアクション
   操作感: 加速/減速, 可変ジャンプ, コヨーテタイム, 先行入力,
           ダッシュ, 踏みつけ, ブロック叩き, パワーアップ
   ============================================================ */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 960, H = 540, TILE = 48;
const VIEW_TILES_X = W / TILE; // 20

/* ---------- 画面フィット ---------- */
function fit(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---------- サウンド (Web Audio) ---------- */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, type, vol, slideTo, delay){
  const ac = audio(); if(!ac) return;
  const t0 = ac.currentTime + (delay||0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol || 0.08, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const SFX = {
  jump(big){ tone(big?300:380, 0.18, 'square', 0.07, big?700:900); },
  coin(){ tone(988, 0.07, 'square', 0.07); tone(1319, 0.35, 'square', 0.07, null, 0.07); },
  stomp(){ tone(500, 0.15, 'square', 0.08, 60); },
  bump(){ tone(140, 0.09, 'square', 0.09, 70); },
  brk(){ tone(220, 0.12, 'triangle', 0.12, 40); tone(90, 0.16, 'square', 0.06, 45, 0.02); },
  sprout(){ tone(500, 0.35, 'sine', 0.08, 1400); },
  power(){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.11,'square',0.07,null,i*0.07)); },
  shrink(){ [800,700,600,500,400,300].forEach((f,i)=>tone(f,0.1,'square',0.07,null,i*0.06)); },
  kick(){ tone(600,0.1,'square',0.08,150); },
  die(){ [660,620,580,540,500,460,420].forEach((f,i)=>tone(f,0.13,'triangle',0.09,null,i*0.1)); tone(196,0.5,'triangle',0.09,null,0.75); },
  clear(){ [523,523,523,659,784,1047].forEach((f,i)=>tone(f,0.14,'square',0.07,null,i*0.11)); tone(784,0.5,'square',0.07,null,0.7); },
  flag(){ tone(400,0.4,'square',0.06,1200); }
};

/* ---------- 入力 ---------- */
const keys = {};
const pressed = {}; // 押した瞬間だけ立つ
window.addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; audio();
});
window.addEventListener('keyup', e=>{ keys[e.code] = false; });
function bindTouch(id, code){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); if(!keys[code]) pressed[code]=true; keys[code]=true; audio(); };
  const off = e=>{ e.preventDefault(); keys[code]=false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off);
}
bindTouch('tLeft','ArrowLeft'); bindTouch('tRight','ArrowRight');
bindTouch('tJump','Space'); bindTouch('tRun','ShiftLeft');
cvs.addEventListener('pointerdown', ()=>{ pressed['Enter'] = true; audio(); });

const IN = {
  left(){ return keys['ArrowLeft'] || keys['KeyA']; },
  right(){ return keys['ArrowRight'] || keys['KeyD']; },
  run(){ return keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyX']; },
  jumpHeld(){ return keys['Space'] || keys['KeyZ'] || keys['ArrowUp'] || keys['KeyW']; },
  jumpPressed(){ return pressed['Space'] || pressed['KeyZ'] || pressed['ArrowUp'] || pressed['KeyW']; },
  startPressed(){ return pressed['Enter'] || pressed['Space']; }
};

/* ---------- ステージ構築 ---------- */
const GY = 10; // 地面の上面タイルY (地面は y=10,11)
let solids = [], coinsArr = [], enemySpawns = [], particles = [], popups = [], movers = [];
let goalX = 0, worldW = 0;

function S(x,y,w,h,type){ solids.push({x:x*TILE, y:y*TILE, w:w*TILE, h:h*TILE, type:type||'hard', used:false, anim:0}); }
function ground(x, w){ S(x, GY, w, 2, 'ground'); }
function pipe(x, h){ // 高さhタイルの土管 (2タイル幅)
  S(x, GY-h, 2, 1, 'pipeTop'); S(x, GY-h+1, 2, h-1, 'pipe');
}
function stairsUp(x, h){ for(let i=0;i<h;i++) S(x+i, GY-1-i, 1, 1+i, 'hard'); }
function stairsDown(x, h){ for(let i=0;i<h;i++) S(x+i, GY-h+i, 1, h-i, 'hard'); }
function coinRow(x, y, n){ for(let i=0;i<n;i++) coinsArr.push({x:(x+i)*TILE+14, y:y*TILE+10, taken:false, ph:Math.random()*6.28}); }
function coinArc(x, y, n){ for(let i=0;i<n;i++){ const t=i/(n-1||1); coinsArr.push({x:(x+i)*TILE+14, y:(y - Math.sin(t*Math.PI)*1.4)*TILE+10, taken:false, ph:Math.random()*6.28}); } }
function foe(x, kind){ enemySpawns.push({x:x*TILE+6, y:(GY-1)*TILE, kind:kind}); }

function buildLevel(){
  solids = []; coinsArr = []; enemySpawns = []; particles = []; popups = []; movers = [];
  /* --- 地形 --- */
  ground(0, 30);            // スタート平原
  ground(32, 22);           // 穴(30-31)
  ground(56, 26);           // 穴(54-55)
  ground(84, 20);           // 穴(82-83)
  ground(107, 30);          // 穴(104-106) 3タイル
  ground(139, 24);          // 穴(137-138)
  ground(165, 40);          // 穴(163-164) ゴールまで
  worldW = 205 * TILE; goalX = 198 * TILE;

  /* --- ブロック群 --- */
  S(10,6,1,1,'bonus'); S(12,6,1,1,'brick'); S(13,6,1,1,'power'); S(14,6,1,1,'brick'); S(15,6,1,1,'bonus');
  S(13,2,1,1,'bonus');
  S(38,6,1,1,'brick'); S(39,6,1,1,'bonus'); S(40,6,1,1,'brick');
  S(62,6,1,1,'bonus'); S(66,6,1,1,'brick'); S(67,6,1,1,'brick');
  S(90,6,1,1,'power'); S(94,6,1,1,'brick'); S(95,6,1,1,'bonus'); S(96,6,1,1,'brick');
  S(112,6,1,1,'brick'); S(113,6,1,1,'bonus'); S(114,6,1,1,'brick'); S(115,6,1,1,'bonus'); S(116,6,1,1,'brick');
  S(146,6,1,1,'bonus'); S(150,6,1,1,'brick'); S(151,6,1,1,'power');
  S(170,6,1,1,'brick'); S(171,6,1,1,'bonus'); S(172,6,1,1,'brick');

  /* --- 土管 --- */
  pipe(20,2); pipe(26,3); pipe(44,2); pipe(48,3); pipe(70,3); pipe(76,2);
  pipe(120,2); pipe(126,3); pipe(155,2); pipe(159,3);

  /* --- 浮き足場 --- */
  S(30,7,2,1,'hard'); S(54,7,2,1,'hard'); S(82,7,2,1,'hard');
  S(103,7,3,1,'hard'); S(136,7,2,1,'hard'); S(162,7,2,1,'hard');
  S(58,5,3,1,'hard'); S(130,4,3,1,'hard');

  /* --- 階段 --- */
  stairsUp(99,4); stairsDown(117,4); // 小さな丘
  stairsUp(176,8); // ゴール前の大階段
  S(184,GY-8,8,1,'hard');

  /* --- コイン --- */
  coinRow(5,8,4); coinArc(29,8,5); coinRow(45,4,3); coinArc(53,8,5);
  coinRow(59,3,3); coinArc(81,8,5); coinRow(91,4,3); coinArc(103,8,5);
  coinRow(121,4,3); coinRow(131,2,3); coinArc(136,8,5); coinRow(147,4,3);
  coinArc(162,8,5); coinRow(178,3,2);

  /* --- 敵 --- */
  foe(17,'walk'); foe(24,'walk'); foe(36,'walk'); foe(41,'walk'); foe(52,'walk');
  foe(60,'walk'); foe(64,'spike'); foe(72,'walk'); foe(79,'walk'); foe(88,'walk');
  foe(92,'spike'); foe(110,'walk'); foe(118,'walk'); foe(124,'walk'); foe(133,'spike');
  foe(142,'walk'); foe(148,'walk'); foe(153,'walk'); foe(167,'walk'); foe(173,'spike');
}

/* ---------- ゲーム状態 ---------- */
let state = 'title'; // title | play | dead | clear | over
let score = 0, coinCount = 0, lives = 3, timeLeft = 300, timeAcc = 0;
let best = +(localStorage.getItem('ssq_best') || 0);
let stateTimer = 0, camX = 0, shake = 0, flagSlide = 0;

const player = {
  x:0, y:0, w:34, h:44, vx:0, vy:0, face:1, big:false,
  ground:false, coyote:0, jbuf:0, animT:0, invuln:0, deadSpin:0
};
function playerH(){ return player.big ? 62 : 44; }

let enemies = [], items = [];
function resetRun(full){
  buildLevel();
  player.x = 2*TILE; player.y = (GY-2)*TILE; player.vx = 0; player.vy = 0;
  player.big = false; player.h = 44; player.invuln = 0; player.deadSpin = 0;
  enemies = enemySpawns.map(s=>({x:s.x, y:s.y, w:36, h:36, vx:-55, vy:0, kind:s.kind, alive:true, squish:0, active:false}));
  items = [];
  camX = 0; flagSlide = 0; timeAcc = 0;
  if(full){ score = 0; coinCount = 0; lives = 3; timeLeft = 300; }
}

/* ---------- 物理 ---------- */
const GRAV = 2300, JUMP_V = 860, MAX_WALK = 265, MAX_RUN = 400;
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function solidAt(x, y){ // 点が固体タイル内か (ブロック単位)
  for(const s of solids){ if(x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h) return s; } return null;
}
function moveAndCollide(e, dt){
  // X方向
  e.x += e.vx * dt;
  for(const s of solids){
    if(overlap(e, s)){
      if(e.vx > 0) e.x = s.x - e.w; else if(e.vx < 0) e.x = s.x + s.w;
      e.hitWall = true; e.vx = e.isPlayer ? 0 : -e.vx;
    }
  }
  // Y方向
  e.y += e.vy * dt; e.ground = false;
  for(const s of solids){
    if(overlap(e, s)){
      if(e.vy > 0){ e.y = s.y - e.h; e.vy = 0; e.ground = true; }
      else if(e.vy < 0){
        e.y = s.y + s.h; e.vy = 0;
        if(e.isPlayer) headHit(s);
      }
    }
  }
}
function burst(x, y, n, color, spd){
  for(let i=0;i<n;i++){ const a = Math.random()*6.28, v = (Math.random()*0.7+0.3)*(spd||220);
    particles.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-120, life:0.5+Math.random()*0.3, t:0, color:color, size:3+Math.random()*4}); }
}

/* ---------- ブロックを叩く ---------- */
function headHit(s){
  if(s.type === 'bonus' && !s.used){
    s.used = true; s.anim = 0.25; SFX.coin();
    coinCount++; score += 200;
    popups.push({x:s.x+24, y:s.y-30, vy:-260, t:0, kind:'coin'});
    addScoreText(s.x+24, s.y-16, '200');
    if(coinCount >= 100){ coinCount -= 100; lives++; }
  } else if(s.type === 'power' && !s.used){
    s.used = true; s.anim = 0.25; SFX.sprout();
    items.push({x:s.x+6, y:s.y-36, w:36, h:36, vx:60, vy:0, kind:'berry', t:0});
  } else if(s.type === 'brick'){
    if(player.big){
      solids.splice(solids.indexOf(s), 1); SFX.brk(); shake = Math.max(shake, 4);
      burst(s.x+24, s.y+24, 10, '#c1562f', 300); score += 50;
    } else { s.anim = 0.18; SFX.bump(); }
  } else if(s.type === 'bonus' || s.type === 'power' || s.type === 'hard' || s.type === 'ground'){
    SFX.bump();
  }
}
function addScoreText(x, y, txt){ popups.push({x:x, y:y, vy:-70, t:0, kind:'text', txt:txt}); }

/* ---------- プレイヤー更新 ---------- */
function updatePlayer(dt){
  const p = player;
  p.h = playerH();
  if(p.invuln > 0) p.invuln -= dt;
  const maxS = IN.run() ? MAX_RUN : MAX_WALK;
  const acc = p.ground ? 2600 : 1700;
  if(IN.left()){ p.vx = Math.max(p.vx - acc*dt, -maxS); p.face = -1; }
  else if(IN.right()){ p.vx = Math.min(p.vx + acc*dt, maxS); p.face = 1; }
  else if(p.ground){ const f = 3000*dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx)*f; }

  if(p.ground) p.coyote = 0.09; else p.coyote -= dt;
  if(IN.jumpPressed()) p.jbuf = 0.12; else p.jbuf -= dt;
  if(p.jbuf > 0 && p.coyote > 0){
    p.vy = -JUMP_V; p.jbuf = 0; p.coyote = 0; SFX.jump(p.big);
    burst(p.x + p.w/2, p.y + p.h, 5, '#ffffff', 120);
  }
  if(!IN.jumpHeld() && p.vy < -300) p.vy = -300; // 可変ジャンプ
  p.vy = Math.min(p.vy + GRAV*dt, 1150);
  p.isPlayer = true;
  moveAndCollide(p, dt);
  if(p.x < camX) p.x = camX; // 画面左端より戻れない
  if(p.ground) p.animT += Math.abs(p.vx) * dt * 0.045; else p.animT = 0;

  // コイン
  for(const c of coinsArr){
    if(!c.taken && Math.abs(c.x + 10 - (p.x + p.w/2)) < 34 && Math.abs(c.y + 14 - (p.y + p.h/2)) < p.h/2 + 20){
      c.taken = true; SFX.coin(); coinCount++; score += 200;
      burst(c.x+10, c.y+14, 6, '#ffd83d', 160);
      if(coinCount >= 100){ coinCount -= 100; lives++; }
    }
  }
  // アイテム (パワーベリー)
  for(const it of items){
    if(it.kind === 'berry' && overlap(p, it)){
      it.taken = true;
      if(!p.big){ p.big = true; p.y -= 18; score += 1000; addScoreText(p.x+17, p.y-10, '1000'); }
      else score += 1000;
      SFX.power();
    }
  }
  items = items.filter(i=>!i.taken);
  // ゴール
  if(p.x + p.w >= goalX && state === 'play'){
    state = 'clear'; stateTimer = 0; SFX.flag();
    score += Math.floor(timeLeft) * 50;
  }
  // 落下
  if(p.y > H + 500 || p.y > (GY+3)*TILE) startDeath();
}
function hurtPlayer(){
  if(player.invuln > 0 || state !== 'play') return;
  if(player.big){ player.big = false; player.invuln = 2; SFX.shrink(); }
  else startDeath();
}
function startDeath(){
  if(state !== 'play') return;
  state = 'dead'; stateTimer = 0; player.vy = -700; SFX.die();
}

/* ---------- 敵・アイテム更新 ---------- */
function updateEnemies(dt){
  for(const e of enemies){
    if(!e.alive) continue;
    if(!e.active){ if(e.x < camX + W + 80) e.active = true; else continue; }
    if(e.squish > 0){ e.squish -= dt; if(e.squish <= 0) e.alive = false; continue; }
    e.vy = Math.min(e.vy + GRAV*dt, 1000);
    // 崖で引き返す (歩行タイプのみ)
    if(e.kind === 'walk' && e.ground){
      const footX = e.vx < 0 ? e.x - 4 : e.x + e.w + 4;
      if(!solidAt(footX, e.y + e.h + 8)) e.vx = -e.vx;
    }
    moveAndCollide(e, dt);
    if(e.y > (GY+4)*TILE){ e.alive = false; continue; }
    // プレイヤーとの接触
    if(state === 'play' && overlap(player, e)){
      const stomp = player.vy > 60 && (player.y + player.h) - e.y < 26;
      if(stomp && e.kind === 'walk'){
        e.squish = 0.35; SFX.stomp(); score += 100; addScoreText(e.x+18, e.y-12, '100');
        player.vy = IN.jumpHeld() ? -640 : -420; player.y = e.y - player.h - 1;
      } else if(stomp && e.kind === 'spike'){ hurtPlayer(); player.vy = -420; }
      else hurtPlayer();
    }
  }
  for(const it of items){
    it.t += dt; it.vy = Math.min(it.vy + GRAV*dt, 900);
    moveAndCollide(it, dt);
  }
  items = items.filter(i=>i.y < (GY+4)*TILE);
}

/* ---------- 描画 ---------- */
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a86e8'); g.addColorStop(0.7, '#79a6ff'); g.addColorStop(1, '#a8c8ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 太陽
  ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(850 - camX*0.02 % 40, 70, 34, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#ffe95e'; ctx.beginPath(); ctx.arc(850 - camX*0.02 % 40, 70, 27, 0, 6.29); ctx.fill();
  // 雲 (パララックス 0.3)
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  for(let i=0;i<14;i++){
    const cx = ((i*337 + 60) - camX*0.3) % (W+260); const x = cx < -130 ? cx + W + 260 : cx;
    const cy = 36 + (i*53) % 130;
    ctx.beginPath();
    ctx.arc(x, cy, 22, 0, 6.29); ctx.arc(x+24, cy+4, 17, 0, 6.29); ctx.arc(x-24, cy+5, 16, 0, 6.29); ctx.arc(x+2, cy-10, 18, 0, 6.29);
    ctx.fill();
  }
  // 遠くの山 (0.5)
  ctx.fillStyle = '#5fae5f';
  for(let i=0;i<10;i++){
    const bx = ((i*420) - camX*0.5) % (W+420); const x = bx < -420 ? bx + W + 420 : bx;
    ctx.beginPath(); ctx.moveTo(x, GY*TILE); ctx.lineTo(x+130, GY*TILE-120); ctx.lineTo(x+280, GY*TILE); ctx.closePath(); ctx.fill();
  }
  // 近くの丘 (0.75)
  ctx.fillStyle = '#3f9e4d';
  for(let i=0;i<8;i++){
    const bx = ((i*560 + 200) - camX*0.75) % (W+560); const x = bx < -560 ? bx + W + 560 : bx;
    ctx.beginPath(); ctx.arc(x+110, GY*TILE+40, 120, Math.PI, 0); ctx.fill();
  }
}
function drawTile(s){
  const x = s.x - camX, y = s.y - (s.anim > 0 ? Math.sin((0.25 - Math.max(s.anim,0)) / 0.25 * Math.PI) * 10 : 0);
  if(x + s.w < -50 || x > W + 50) return;
  if(s.type === 'ground'){
    ctx.fillStyle = '#c84c0c'; ctx.fillRect(x, y, s.w, s.h);
    ctx.fillStyle = '#e2703a';
    for(let tx = 0; tx < s.w; tx += TILE) for(let ty = 1; ty < s.h / TILE; ty++)
      ctx.fillRect(x + tx + 6, y + ty*TILE + 10, 10, 6), ctx.fillRect(x + tx + 28, y + ty*TILE + 28, 10, 6);
    ctx.fillStyle = '#00a800'; ctx.fillRect(x, y, s.w, 16);
    ctx.fillStyle = '#3fd13f'; ctx.fillRect(x, y, s.w, 7);
    ctx.fillStyle = '#007800';
    for(let tx = 0; tx < s.w; tx += TILE) ctx.fillRect(x + tx + 10, y + 10, 16, 5);
  } else if(s.type === 'hard'){
    ctx.fillStyle = '#9c9c9c'; ctx.fillRect(x, y, s.w, s.h);
    ctx.fillStyle = '#c8c8c8'; ctx.fillRect(x, y, s.w, 6); ctx.fillRect(x, y, 6, s.h);
    ctx.fillStyle = '#5c5c5c'; ctx.fillRect(x, y + s.h - 6, s.w, 6); ctx.fillRect(x + s.w - 6, y, 6, s.h);
    ctx.fillStyle = '#787878'; ctx.fillRect(x + s.w/2 - 3, y + s.h/2 - 3, 6, 6);
  } else if(s.type === 'brick'){
    ctx.fillStyle = '#c1562f'; ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#e88a5f'; ctx.fillRect(x, y, TILE, 5);
    ctx.fillStyle = '#7e2f14'; ctx.fillRect(x, y + 22, TILE, 4); ctx.fillRect(x, y + 44, TILE, 4);
    ctx.fillRect(x + 22, y, 4, 22); ctx.fillRect(x + 10, y + 26, 4, 18); ctx.fillRect(x + 34, y + 26, 4, 18);
  } else if(s.type === 'bonus' || s.type === 'power'){
    if(s.used){ ctx.fillStyle = '#9c6b30'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#7a5220'; ctx.fillRect(x+6, y+6, 6, 6); ctx.fillRect(x+36, y+6, 6, 6); ctx.fillRect(x+6, y+36, 6, 6); ctx.fillRect(x+36, y+36, 6, 6);
      return; }
    const bob = Math.sin(performance.now()/300 + s.x) * 2;
    ctx.fillStyle = '#f8b800'; ctx.fillRect(x, y + bob, TILE, TILE);
    ctx.fillStyle = '#ffd83d'; ctx.fillRect(x, y + bob, TILE, 6);
    ctx.fillStyle = '#b87e00'; ctx.fillRect(x + 5, y + bob + 5, 5, 5); ctx.fillRect(x + 38, y + bob + 5, 5, 5);
    ctx.fillRect(x + 5, y + bob + 38, 5, 5); ctx.fillRect(x + 38, y + bob + 38, 5, 5);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(s.type === 'power' ? '★' : '?', x + 24, y + bob + 35);
  } else if(s.type === 'pipeTop'){
    ctx.fillStyle = '#00a800'; ctx.fillRect(x - 4, y, s.w + 8, s.h);
    ctx.fillStyle = '#3fd13f'; ctx.fillRect(x - 4, y, s.w + 8, 10);
    ctx.fillStyle = '#006800'; ctx.fillRect(x + s.w - 8, y, 12, s.h);
  } else if(s.type === 'pipe'){
    ctx.fillStyle = '#00a800'; ctx.fillRect(x, y, s.w, s.h);
    ctx.fillStyle = '#3fd13f'; ctx.fillRect(x + 8, y, 14, s.h);
    ctx.fillStyle = '#006800'; ctx.fillRect(x + s.w - 12, y, 12, s.h);
  }
}
function drawCoinShape(x, y, t){
  const sq = Math.abs(Math.cos(t * 4));
  ctx.save(); ctx.translate(x + 10, y + 14); ctx.scale(0.35 + 0.65 * sq, 1);
  ctx.fillStyle = '#ffd83d'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#f8b800'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#ffe95e'; ctx.fillRect(-2, -6, 4, 12);
  ctx.restore();
}
function drawPlayer(){
  const p = player;
  if(p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0 && state === 'play') return; // 点滅
  const x = p.x - camX, y = p.y;
  const sc = p.big ? 62/44 : 1;
  ctx.save(); ctx.translate(x + p.w/2, y + p.h);
  ctx.scale(p.face * sc, sc);
  if(state === 'dead') ctx.rotate(p.deadSpin);
  const run = p.ground && Math.abs(p.vx) > 20;
  const legA = run ? Math.sin(p.animT * 6) * 9 : 0;
  const air = !p.ground;
  // 脚
  ctx.fillStyle = '#2438a8';
  if(air){ ctx.fillRect(-11, -14, 9, 12); ctx.fillRect(3, -10, 9, 9); }
  else { ctx.fillRect(-11 + legA * 0.6, -13, 9, 13 - Math.abs(legA) * 0.4); ctx.fillRect(2 - legA * 0.6, -13, 9, 13 - Math.abs(legA) * 0.4); }
  // 靴
  ctx.fillStyle = '#7e2f14';
  if(air){ ctx.fillRect(-13, -4, 13, 5); ctx.fillRect(2, -2, 13, 5); }
  else { ctx.fillRect(-13 + legA * 0.6, -3, 13, 5); ctx.fillRect(1 - legA * 0.6, -3, 13, 5); }
  // 体 (オーバーオール + シャツ)
  ctx.fillStyle = '#e7402e'; ctx.fillRect(-13, -32, 26, 12);
  ctx.fillStyle = '#2438a8'; ctx.fillRect(-11, -22, 22, 11);
  ctx.fillStyle = '#ffd83d'; ctx.fillRect(-7, -24, 4, 4); ctx.fillRect(3, -24, 4, 4);
  // 腕
  ctx.fillStyle = '#e7402e';
  const armA = run ? Math.sin(p.animT * 6) * 7 : 0;
  if(air){ ctx.fillRect(10, -34, 8, 14); ctx.fillRect(-19, -28, 8, 12); }
  else { ctx.fillRect(11, -30 + armA * 0.5, 8, 15); ctx.fillRect(-19, -30 - armA * 0.5, 8, 15); }
  ctx.fillStyle = '#ffcf9e';
  ctx.fillRect(11, air ? -22 : -17 + armA * 0.5, 8, 6); ctx.fillRect(-19, air ? -18 : -17 - armA * 0.5, 8, 6);
  // 顔
  ctx.fillStyle = '#ffcf9e'; ctx.fillRect(-11, -46, 24, 15);
  ctx.fillStyle = '#202020'; ctx.fillRect(6, -41, 4, 6); // 目
  ctx.fillStyle = '#7e2f14'; ctx.fillRect(9, -33, 6, 3); // 口ひげ風
  // 帽子 (ティール)
  ctx.fillStyle = '#0e9c8c'; ctx.fillRect(-13, -52, 28, 8); ctx.fillRect(8, -46, 12, 4);
  ctx.fillStyle = '#fff'; ctx.fillRect(-4, -51, 9, 6);
  ctx.fillStyle = '#0e9c8c'; ctx.font = 'bold 7px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('S', 0.5, -45.5);
  ctx.restore();
}
function drawEnemy(e){
  const x = e.x - camX, y = e.y;
  if(x < -80 || x > W + 80) return;
  ctx.save(); ctx.translate(x + 18, y + 36);
  if(e.squish > 0) ctx.scale(1.25, 0.3);
  if(e.kind === 'walk'){
    const step = Math.sin(performance.now()/120 + e.x * 0.1) * 3;
    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(-13, -6, 10, 6); ctx.fillRect(3, -6, 10, 6);
    ctx.fillStyle = '#a0522d'; ctx.beginPath(); ctx.arc(0, -20, 17, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#c47b42'; ctx.beginPath(); ctx.arc(0, -24, 13, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-9, -30, 6, 9); ctx.fillRect(3, -30, 6, 9);
    ctx.fillStyle = '#202020';
    const look = e.vx < 0 ? -1 : 1;
    ctx.fillRect(-8 + look, -27, 3, 5); ctx.fillRect(4 + look, -27, 3, 5);
    ctx.fillRect(-7, -14, 14, 3);
  } else { // spike
    ctx.fillStyle = '#3a3a4a';
    for(let i=0;i<8;i++){ const a = i/8 * 6.283; ctx.beginPath();
      ctx.moveTo(Math.cos(a)*10, -18 + Math.sin(a)*10);
      ctx.lineTo(Math.cos(a)*20, -18 + Math.sin(a)*20);
      ctx.lineTo(Math.cos(a+0.4)*10, -18 + Math.sin(a+0.4)*10); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, -18, 14, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ff5040'; ctx.fillRect(-7, -22, 4, 5); ctx.fillRect(3, -22, 4, 5);
  }
  ctx.restore();
}
function drawGoal(){
  const x = goalX - camX;
  if(x < -120 || x > W + 120) return;
  const topY = (GY - 9) * TILE, botY = GY * TILE;
  ctx.fillStyle = '#c0c0c0'; ctx.fillRect(x + 20, topY, 6, botY - topY);
  ctx.fillStyle = '#ffd83d'; ctx.beginPath(); ctx.arc(x + 23, topY - 4, 8, 0, 6.29); ctx.fill();
  // 旗 (クリアで下がる)
  const fy = topY + 14 + flagSlide;
  ctx.fillStyle = '#0e9c8c';
  ctx.beginPath(); ctx.moveTo(x + 20, fy); ctx.lineTo(x - 22, fy + 13); ctx.lineTo(x + 20, fy + 26); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('S', x + 6, fy + 18);
  // 城
  const cx0 = x + 70;
  ctx.fillStyle = '#b0562f';
  ctx.fillRect(cx0, botY - 90, 130, 90);
  ctx.fillRect(cx0 + 45, botY - 140, 40, 50);
  ctx.fillStyle = '#8a3d1e';
  for(let i=0;i<4;i++) ctx.fillRect(cx0 + 4 + i*32, botY - 102, 18, 12);
  ctx.fillRect(cx0 + 49, botY - 152, 10, 12); ctx.fillRect(cx0 + 71, botY - 152, 10, 12);
  ctx.fillStyle = '#402010'; rr(cx0 + 50, botY - 44, 30, 44, 14); ctx.fill();
  ctx.fillStyle = '#e7402e'; ctx.beginPath(); ctx.moveTo(cx0 + 40, botY - 140); ctx.lineTo(cx0 + 65, botY - 168); ctx.lineTo(cx0 + 90, botY - 140); ctx.closePath(); ctx.fill();
}
function drawHUD(){
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, 44);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 19px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + String(score).padStart(6, '0'), 18, 30);
  ctx.fillText('× ' + String(coinCount).padStart(2, '0'), 330, 30);
  drawCoinShape(296, 4, 0.4);
  ctx.fillText('WORLD 1-1', 470, 30);
  ctx.fillText('TIME ' + Math.max(0, Math.ceil(timeLeft)), 660, 30);
  ctx.fillText('LIFE × ' + lives, 810, 30);
  ctx.textAlign = 'left';
}
function centerText(txt, y, size, color){
  ctx.fillStyle = color || '#fff'; ctx.font = 'bold ' + size + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText(txt, W/2, y); ctx.textAlign = 'left';
}
function draw(){
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5) * shake * 2, (Math.random()-0.5) * shake * 2);
  drawBackground();
  drawGoal();
  for(const s of solids) drawTile(s);
  const t = performance.now() / 1000;
  for(const c of coinsArr){ if(!c.taken && c.x - camX > -40 && c.x - camX < W + 40) drawCoinShape(c.x - camX, c.y + Math.sin(t * 3 + c.ph) * 3, t + c.ph); }
  for(const it of items){
    if(it.kind === 'berry'){
      const x = it.x - camX, y = it.y;
      ctx.fillStyle = '#e7402e'; ctx.beginPath(); ctx.arc(x + 18, y + 20, 15, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#ff8a7a'; ctx.beginPath(); ctx.arc(x + 12, y + 14, 5, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#00a800'; ctx.fillRect(x + 15, y + 1, 6, 8);
      ctx.fillStyle = '#fff'; ctx.fillRect(x + 10, y + 16, 4, 6); ctx.fillRect(x + 22, y + 16, 4, 6);
    }
  }
  for(const e of enemies) if(e.alive) drawEnemy(e);
  if(state !== 'over') drawPlayer();
  for(const pt of particles){
    ctx.globalAlpha = Math.max(0, 1 - pt.t / pt.life);
    ctx.fillStyle = pt.color; ctx.fillRect(pt.x - camX, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  for(const pp of popups){
    if(pp.kind === 'coin') drawCoinShape(pp.x - camX - 10, pp.y, 0.2);
    else { ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pp.txt, pp.x - camX, pp.y); ctx.textAlign = 'left'; }
  }
  ctx.restore();
  drawHUD();
  if(state === 'title'){
    ctx.fillStyle = 'rgba(10,10,40,0.55)'; ctx.fillRect(0, 0, W, H);
    centerText('SUPER SCROLL QUEST', 190, 52, '#ffd83d');
    centerText('スーパー・スクロール・クエスト', 232, 20, '#fff');
    centerText('←→ 移動 / スペース: ジャンプ / Shift: ダッシュ', 320, 19);
    centerText('ブロックを下から叩く・敵は踏む・★で大きくなる', 352, 19);
    centerText('Enter または タップでスタート', 420, 24, '#ffd83d');
    if(best > 0) centerText('BEST ' + best, 462, 18, '#a8c8ff');
  } else if(state === 'clear'){
    ctx.fillStyle = 'rgba(10,30,10,0.45)'; ctx.fillRect(0, 0, W, H);
    centerText('COURSE CLEAR!', 220, 48, '#ffd83d');
    centerText('SCORE ' + score, 280, 26);
    centerText('Enter: もう一度', 340, 20, '#a8ffb0');
  } else if(state === 'over'){
    ctx.fillStyle = 'rgba(20,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    centerText('GAME OVER', 230, 48, '#ff6a5e');
    centerText('SCORE ' + score + '   BEST ' + best, 290, 24);
    centerText('Enter: タイトルへ', 350, 20, '#ffd0cc');
  } else if(state === 'dead' && stateTimer < 0.4){
    // 死亡直後はそのまま
  }
  if(paused){
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    centerText('PAUSE', 270, 40);
  }
}

/* ---------- メインループ ---------- */
let paused = false, lastT = 0;
window.addEventListener('keydown', e=>{
  if((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
});
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastT) / 1000 || 0, 1/30); lastT = ts;
  if(paused){ draw(); return; }
  const t = performance.now() / 1000;

  if(state === 'title'){
    if(IN.startPressed()){ resetRun(true); state = 'play'; }
  } else if(state === 'play'){
    timeLeft -= dt;
    if(timeLeft <= 0){ timeLeft = 0; startDeath(); }
    updatePlayer(dt);
    updateEnemies(dt);
    for(const s of solids) if(s.anim > 0) s.anim -= dt;
    // カメラ: プレイヤー前方を見せる
    const target = player.x + player.w/2 - W * 0.42 + player.face * 30;
    camX += (target - camX) * Math.min(1, dt * 7);
    camX = Math.max(0, Math.min(camX, worldW - W));
  } else if(state === 'dead'){
    stateTimer += dt;
    if(stateTimer > 0.5 && stateTimer < 1.6){ player.y += player.vy * dt; player.vy += GRAV * dt; player.deadSpin += dt * 9; }
    if(stateTimer >= 1.8){
      lives--;
      if(lives < 0){ state = 'over'; if(score > best){ best = score; localStorage.setItem('ssq_best', best); } }
      else { const keepScore = score, keepCoins = coinCount; resetRun(false); score = keepScore; coinCount = keepCoins; state = 'play'; }
    }
  } else if(state === 'clear'){
    stateTimer += dt;
    flagSlide = Math.min(flagSlide + dt * 160, (GY - 2) * TILE - ((GY - 9) * TILE + 40));
    if(stateTimer > 1.2){ player.vx = 120; player.x += player.vx * dt; player.animT += dt * 8; }
    if(IN.startPressed() && stateTimer > 1.5){
      if(score > best){ best = score; localStorage.setItem('ssq_best', best); }
      state = 'title';
    }
  } else if(state === 'over'){
    if(IN.startPressed()) state = 'title';
  }
  // パーティクル・ポップアップ
  for(const pt of particles){ pt.t += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 900 * dt; }
  particles = particles.filter(p2 => p2.t < p2.life);
  for(const pp of popups){ pp.t += dt; pp.y += pp.vy * dt; pp.vy *= 0.92; }
  popups = popups.filter(p2 => p2.t < 0.8);
  if(shake > 0) shake = Math.max(0, shake - dt * 14);
  for(const k in pressed) delete pressed[k];
  draw();
}
resetRun(true); state = 'title';
requestAnimationFrame(loop);
</script>
